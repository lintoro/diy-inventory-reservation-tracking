  <script>
    let currentUser = null;
    let cachedDashboardData = null;

    window.addEventListener("DOMContentLoaded", function() {
      setupDragAndDrop();
      checkAuthSession();
    });

    function showLoading(show, msg) {
      const el = document.getElementById("loading");
      if (msg) document.getElementById("loading-msg").innerText = msg;
      el.style.display = show ? "flex" : "none";
    }

    function checkAuthSession() {
      // 讀取記住的公司工號
      const savedEmpNo = localStorage.getItem("diy_saved_empno");
      const loginEmpInput = document.getElementById("login-empno");
      const rememberChk = document.getElementById("remember-empno");
      if (savedEmpNo && loginEmpInput) {
        loginEmpInput.value = savedEmpNo;
        if (rememberChk) rememberChk.checked = true;
      }

      const saved = sessionStorage.getItem("diy_user_session");
      if (saved) {
        try {
          currentUser = JSON.parse(saved);
          renderAppForUser();
          return;
        } catch (e) {
          sessionStorage.removeItem("diy_user_session");
        }
      }
      showAuthSection(true);
    }

    function showAuthSection(show) {
      document.getElementById("auth-section").style.display = show ? "block" : "none";
      document.getElementById("main-system").style.display = show ? "none" : "block";
      document.getElementById("header-user-box").style.display = show ? "none" : "flex";
    }

    function showAuthView(view) {
      document.getElementById("card-login").style.display = (view === "login") ? "block" : "none";
      document.getElementById("card-register").style.display = (view === "register") ? "block" : "none";
    }

    function handleLogin() {
      const empNo = document.getElementById("login-empno").value.trim();
      const pwd = document.getElementById("login-pwd").value;
      if (!empNo || !pwd) {
        alert("請輸入工號與密碼！");
        return;
      }

      showLoading(true, "驗證登入中...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          if (!res.success) {
            alert("❌ " + res.message);
            return;
          }
          currentUser = res.user;
          sessionStorage.setItem("diy_user_session", JSON.stringify(currentUser));

          // 處理工號記憶
          const rememberChk = document.getElementById("remember-empno");
          if (rememberChk && rememberChk.checked) {
            localStorage.setItem("diy_saved_empno", empNo);
          } else {
            localStorage.removeItem("diy_saved_empno");
          }

          renderAppForUser();
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("登入連線失敗: " + err);
        })
        .api_login(empNo, pwd);
    }

    function handleRegister() {
      const empNo = document.getElementById("reg-empno").value.trim();
      const name = document.getElementById("reg-name").value.trim();
      const dept = document.getElementById("reg-dept").value.trim();
      if (!empNo || !name) {
        alert("請輸入工號與姓名！");
        return;
      }

      showLoading(true, "提交申請中...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          if (res.success) {
            document.getElementById("reg-empno").value = "";
            document.getElementById("reg-name").value = "";
            document.getElementById("reg-dept").value = "";
            showAuthView("login");
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("申請失敗: " + err);
        })
        .api_registerUser(empNo, name, dept);
    }

    function handleLogout() {
      sessionStorage.removeItem("diy_user_session");
      currentUser = null;
      document.getElementById("login-pwd").value = "";
      showAuthSection(true);
      showAuthView("login");
    }

    function renderAppForUser() {
      if (!currentUser) return;
      showAuthSection(false);

      document.getElementById("user-display-name").innerText = currentUser.name;
      document.getElementById("user-display-empno").innerText = "(" + currentUser.empNo + ")";
      document.getElementById("user-display-role").innerText = currentUser.role;

      const ccStaffInput = document.getElementById("cc-staff");
      if (ccStaffInput) ccStaffInput.value = `${currentUser.name} (${currentUser.empNo})`;

      if (currentUser.mustChangePassword) {
        document.getElementById("modal-must-change-pwd").style.display = "flex";
      } else {
        document.getElementById("modal-must-change-pwd").style.display = "none";
      }

      const btnAdmin = document.getElementById("tab-btn-admin");
      const btnAudit = document.getElementById("tab-btn-audit");
      const btnBooking = document.getElementById("tab-btn-booking");
      const btnManager = document.getElementById("tab-btn-manager");
      const btnBom = document.getElementById("tab-btn-bom");

      if (currentUser.role === "ADMIN") {
        btnAdmin.style.display = "inline-block";
        if (btnAudit) btnAudit.style.display = "inline-block";
        btnBooking.style.display = "inline-block";
        btnManager.style.display = "inline-block";
        if (btnBom) btnBom.style.display = "inline-block";
        switchTab("tab-admin");
      } else if (currentUser.role === "SALES") {
        btnAdmin.style.display = "none";
        if (btnAudit) btnAudit.style.display = "none";
        btnBooking.style.display = "inline-block";
        btnManager.style.display = "none";
        if (btnBom) btnBom.style.display = "none";
        switchTab("tab-booking");
      } else if (currentUser.role === "INVENTORY") {
        btnAdmin.style.display = "none";
        if (btnAudit) btnAudit.style.display = "none";
        btnBooking.style.display = "none";
        btnManager.style.display = "inline-block";
        if (btnBom) btnBom.style.display = "inline-block";
        switchTab("tab-manager");
      }

      // 生成建議預約單號帶出
      initDefaultBookingNo();
      // 初始化到貨日預設為 15 天後
      initDefaultArrivalDate();
      loadDashboard();
      initProjectionDateSelect();
    }

    function initDefaultBookingNo(force) {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const r = String(Math.floor(Math.random() * 900) + 100);
      const input = document.getElementById("bk-no");
      if (input && (force === true || !input.value)) {
        input.value = `BK-${y}${m}${d}-${r}`;
      }
    }

    function initDefaultArrivalDate() {
      const now = new Date();
      now.setDate(now.getDate() + 15);
      const arrInput = document.getElementById("po-arrival-date");
      if (arrInput && !arrInput.value) {
        arrInput.value = now.toISOString().substring(0, 10);
      }
    }

    function handleChangePasswordSubmit() {
      const oldPwd = document.getElementById("chg-old-pwd").value;
      const newPwd = document.getElementById("chg-new-pwd").value;
      const confirmPwd = document.getElementById("chg-confirm-pwd").value;

      if (!oldPwd || !newPwd || !confirmPwd) {
        alert("請完整輸入所有密碼欄位！");
        return;
      }
      if (newPwd !== confirmPwd) {
        alert("兩次輸入的新密碼不一致！");
        return;
      }
      if (newPwd.length < 6) {
        alert("新密碼長度至少需 6 碼！");
        return;
      }

      showLoading(true, "更新密碼中...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          if (!res.success) {
            alert("❌ " + res.message);
            return;
          }
          alert("🎉 " + res.message);
          currentUser.mustChangePassword = false;
          sessionStorage.setItem("diy_user_session", JSON.stringify(currentUser));
          document.getElementById("modal-must-change-pwd").style.display = "none";
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("修改密碼連線失敗: " + err);
        })
        .api_changePassword(currentUser.empNo, oldPwd, newPwd);
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      
      const pane = document.getElementById(tabId);
      if (pane) pane.classList.add("active");

      if (tabId === "tab-admin") {
        document.getElementById("tab-btn-admin").classList.add("active");
        loadUsersList();
      }
      if (tabId === "tab-audit") {
        const b = document.getElementById("tab-btn-audit");
        if (b) b.classList.add("active");
        loadAuditLogs(1);
      }
      if (tabId === "tab-booking") document.getElementById("tab-btn-booking").classList.add("active");
      if (tabId === "tab-manager") document.getElementById("tab-btn-manager").classList.add("active");
      if (tabId === "tab-bom") {
        const b = document.getElementById("tab-btn-bom");
        if (b) b.classList.add("active");
        loadBOMManagement();
        loadMaterialsList();
      }
    }

    // ==================== 儀表板資料與抽屜渲染 ====================
    function loadDashboard() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const dateInput = document.getElementById("bk-date");
      if (!dateInput.value) {
        dateInput.value = tomorrow.toISOString().substring(0, 10);
      }

      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.success) {
            console.error("載入儀表板異常: " + res.message);
            return;
          }
          cachedDashboardData = res;

          // 1. 安全提取陣列
          let capsArray = [];
          if (Array.isArray(res.capacitiesList)) {
            capsArray = res.capacitiesList;
          } else if (res.capacities && typeof res.capacities === "object") {
            capsArray = Object.keys(res.capacities).map(k => res.capacities[k]);
          }

          // 2. 渲染組數看板 ＋ 抽屜 (業務端 與 庫存端)
          renderCapacitiesDrawers("prod-capacities-list-booking", capsArray, res.safetyFloorConfig);
          renderCapacitiesDrawers("prod-capacities-list-manager", capsArray, res.safetyFloorConfig);

          // 2.1 動態更新業務端預約體驗商品下拉選單
          renderBookingProductSelect(res.products);

          // 3. 渲染物料下拉選單 (抽盤 ＋ 採購)
          renderMaterialSelect(res.materials);

          // 4. 直接使用整合回傳的有效預約清單渲染，免除第二次 api_getBookingList RPC 呼叫与重複渲染
          if (Array.isArray(res.activeBookings)) {
            renderBookingList(res.activeBookings);
          } else {
            loadBookingList();
          }

          // 5. 渲染在途採購清單
          renderPendingPOs(res.pendingPOs);

          // 6. 更新保底輸入框預設值
          if (res.safetyFloorConfig) {
            document.getElementById("sf-weekday").value = res.safetyFloorConfig.weekday || 10;
            document.getElementById("sf-weekend").value = res.safetyFloorConfig.weekend || 20;
          }

          // 7. 觸發即時試算與活動日方案可用組數更新
          handleBookingDateChanged();
        })
        .withFailureHandler(function(err) {
          console.error("api_getDashboardOverview 失敗: " + err);
        })
        .api_getDashboardOverview();
    }

    // 業務端預計活動日變動連動處理
    function handleBookingDateChanged() {
      const dateInput = document.getElementById("bk-date");
      if (!dateInput) return;
      const dateVal = dateInput.value;
      if (!dateVal) return;

      // 1. 執行左側即時預約防呆判定
      runLiveEligibilityCheck();

      // 2. 更新右側體驗方案可用組數
      updateBookingCapacitiesByDate(dateVal);
    }

    function updateBookingCapacitiesByDate(dateVal) {
      if (!dateVal || !cachedDashboardData) return;

      const titleBadge = document.getElementById("booking-date-badge");
      if (titleBadge) {
        titleBadge.innerText = `【${dateVal} 試算視角】`;
      }

      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.success) {
            console.error("更新活動日方案組數異常: " + res.message);
            return;
          }

          let capsArray = [];
          if (Array.isArray(cachedDashboardData.capacitiesList)) {
            capsArray = cachedDashboardData.capacitiesList;
          } else if (cachedDashboardData.capacities && typeof cachedDashboardData.capacities === "object") {
            capsArray = Object.keys(cachedDashboardData.capacities).map(k => cachedDashboardData.capacities[k]);
          }

          // 重新繪製業務端右側方案卡片 (依據活動日與是否>45天顯示)
          renderCapacitiesDrawers("prod-capacities-list-booking", capsArray, cachedDashboardData.safetyFloorConfig, res);
        })
        .withFailureHandler(function(err) {
          console.error("api_getProjectionByDate 失敗: " + err);
        })
        .api_getProjectionByDate(dateVal);
    }

    // 輔助函式：將 (o色總量池)、(o款共用)、(o款共同) 等具體種類寫死的標記，統一正規化為 (共用總量)
    function formatSharedLabel(str) {
      if (!str) return "";
      return String(str).replace(/\([0-9\u4e00-\u9fa5a-zA-Z]*[色款種]?(總量池|共用|共同|共用料)\)/g, "(共用總量)");
    }

    // 核心：渲染活動項目卡片與用料抽屜 (支援活動日連動、>45天皆可預訂、三軌庫存透視)
    function renderCapacitiesDrawers(containerId, capsList, sfConfig, dateContext) {
      const container = document.getElementById(containerId);
      if (!container) return;

      if (!capsList || capsList.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:16px; color:#94a3b8;">暫無組數資料</div>';
        return;
      }

      const wkFloor = sfConfig ? sfConfig.weekday : 10;
      const weFloor = sfConfig ? sfConfig.weekend : 20;
      const isBookingView = (containerId === "prod-capacities-list-booking");

      container.innerHTML = capsList.map((p, idx) => {
        const total = p.maxCapacity || 0;
        const netWk = Math.max(0, total - wkFloor);
        const netWe = Math.max(0, total - weFloor);
        const drawerId = `${containerId}-drawer-${p.productId}`;

        // 依據是否為業務端與日期脈絡決定組數呈現
        let displayNumHtml = "";
        let metaDescHtml = "";

        if (isBookingView && dateContext) {
          if (dateContext.isOver45Days) {
            displayNumHtml = `<div class="capacity-num" style="color:#059669; font-size:22px; font-weight:700;">皆可預訂</div>`;
            metaDescHtml = `📅 預約活動日：<b>${dateContext.date}</b> (距今 ${dateContext.daysDiff} 天 >45天) ➔ <span style="color:#059669; font-weight:600;">備料交期充足，排單無限制</span>`;
          } else {
            const dateCap = (dateContext.capacities && dateContext.capacities[p.productId]) ? dateContext.capacities[p.productId] : null;
            const targetNet = (dateCap && dateCap.netQty !== undefined) ? dateCap.netQty : Math.max(0, total - (dateContext.dateType === "假日" ? weFloor : wkFloor));
            displayNumHtml = `<div class="capacity-num">${targetNet} <span style="font-size:13px; font-weight:500; color:#64748b;">套</span></div>`;
            metaDescHtml = `📅 預約活動日：<b>${dateContext.date}</b> (${dateContext.dateType}) ｜ 保留現場散客 ${dateContext.safetyFloor} 份 ➔ 當日預計可用：<b style="color:var(--primary);">${targetNet}</b> 套`;
          }
        } else {
          // 庫管端或預設靜態在庫視角
          displayNumHtml = `<div class="capacity-num">${total} <span style="font-size:13px; font-weight:500; color:#64748b;">套</span></div>`;
          metaDescHtml = `🔒 現場散客保底 (平日${wkFloor} / 假日${weFloor}) ➔ 業務可接約：平日 <b>${netWk}</b> 套 / 假日 <b>${netWe}</b> 套`;
        }

        const parts = p.partsDetail || [];
        const partsRows = parts.map(pt => {
          const erpVal = (pt.erpQty !== undefined && pt.erpQty !== null) ? pt.erpQty : pt.poolTotal;
          const cycleHtml = pt.hasCycleCount
            ? `<strong style="color:#059669;">${pt.cycleCountQty}</strong> <span style="font-size:10px; background:#dcfce7; color:#166534; padding:1px 5px; border-radius:3px; font-weight:600;">[實盤採信]</span>`
            : `<span style="color:#94a3b8; font-size:12px;">未更動 (帶入系統)</span>`;
          const effSourceBadge = pt.hasCycleCount
            ? `<span style="font-size:10px; color:#059669; font-weight:600;">(實盤優先)</span>`
            : `<span style="font-size:10px; color:#64748b;">(系統兜底)</span>`;

          // 在途補貨提醒 HTML (需求 6)
          let supplyNoticeHtml = "";
          if (pt.incomingSupplies && pt.incomingSupplies.length > 0) {
            const inc = pt.incomingSupplies[0];
            supplyNoticeHtml = `<div style="font-size:11px; color:#1d4ed8; font-weight:600; margin-top:2px;">📦 預計 ${inc.arrivalDate} 補貨 (+${inc.qty})</div>`;
          }

          return `
            <tr class="${pt.isBottleneck ? 'highlight-row' : ''}">
              <td><strong>${formatSharedLabel(pt.name)}</strong> ${pt.isBottleneck ? '<span style="color:#ef4444; font-size:11px; font-weight:700;">[短板限制]</span>' : ''}</td>
              <td style="text-align:center;">${pt.requiredPerUnit}</td>
              <td style="text-align:center; color:#475569;">${erpVal}</td>
              <td style="text-align:center;">${cycleHtml}</td>
              <td style="text-align:center; font-weight:700; color:#0f172a;">${pt.poolTotal} ${effSourceBadge}</td>
              <td style="text-align:center; font-weight:700; color:${pt.isBottleneck ? '#ef4444' : 'var(--primary)'};">${pt.possibleUnits} 套</td>
              <td>
                <span class="${pt.statusClass}">${pt.suggestedAction}</span>
                ${supplyNoticeHtml}
              </td>
            </tr>
          `;
        }).join("");

        // 方案整卡在途補貨標籤
        let cardIncomingBadge = "";
        if (dateContext && dateContext.capacities && dateContext.capacities[p.productId] && dateContext.capacities[p.productId].incomingNoticeText) {
          cardIncomingBadge = `<div style="margin-top:4px;"><span style="display:inline-block; font-size:11px; background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; padding:2px 8px; border-radius:12px; font-weight:600;">📦 在途補貨：${dateContext.capacities[p.productId].incomingNoticeText}</span></div>`;
        }

        return `
          <div class="capacity-card">
            <div class="capacity-header" onclick="toggleDrawer('${drawerId}')">
              <div>
                <div class="capacity-title">
                  <span>${p.productName}</span>
                </div>
                <div class="capacity-meta">
                  短板材料：<span style="color:#b91c1c; font-weight:600;">${formatSharedLabel(p.bottleneckCategory)}</span>
                </div>
                ${cardIncomingBadge}
                <div style="font-size:11px; color:#64748b; margin-top:3px;">
                  ${metaDescHtml}
                </div>
              </div>
              <div class="capacity-stats">
                ${displayNumHtml}
                <div style="font-size:12px; color:var(--primary); font-weight:600; margin-top:2px;">
                  點此展開專屬用料抽屜 ▾
                </div>
              </div>
            </div>

            <!-- 抽屜展開區域 -->
            <div id="${drawerId}" class="drawer-content">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <div style="font-size:13px; font-weight:700; color:#334155;">
                  📋 【${p.productName}】專屬原物料庫存與短板透視：
                </div>
                <div style="font-size:11px; color:#059669; font-weight:600;">
                  ✔ 雙軌機制：優先採信現場盤點實數
                </div>
              </div>
              <div class="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>原物料名稱 / 規格花色</th>
                      <th style="text-align:center;">單份需用</th>
                      <th style="text-align:center;">系統數字 (ERP 640倉)</th>
                      <th style="text-align:center;">現場盤點實數</th>
                      <th style="text-align:center;">計算生效在庫</th>
                      <th style="text-align:center;">換算可做</th>
                      <th>最晚下單提醒 / 採購狀態</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${partsRows}
                  </tbody>
                </table>
              </div>
              <div style="font-size:11px; color:#64748b; margin-top:6px; background:#f8fafc; padding:6px 10px; border-radius:4px; border:1px solid #e2e8f0;">
                💡 <b>雙軌庫存說明</b>：若現場盤點沒有更動，則直接帶入系統數字；在計算組數時，<b>優先以現場盤點數字為主</b>。
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function toggleDrawer(drawerId) {
      const el = document.getElementById(drawerId);
      if (el) {
        el.classList.toggle("open");
      }
    }

    // 渲染最近預約紀錄 (今天起 30 天內)
    function renderRecentBookings(list) {
      const tbody = document.getElementById("recent-bookings-tbody");
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px 10px;">未來 30 天內暫無預約登記紀錄</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(b => `
        <tr>
          <td><strong>${b.bookingNo}</strong></td>
          <td>${b.eventDate}</td>
          <td>${b.productName}</td>
          <td>${b.qty}套</td>
          <td>${b.groupName}</td>
          <td><span class="status-badge ${b.light}">${b.light}</span></td>
        </tr>
      `).join("");
    }

    // 動態更新業務端預約體驗商品下拉選單
    function renderBookingProductSelect(products) {
      const select = document.getElementById("bk-product");
      if (!select || !products || products.length === 0) return;
      const currentVal = select.value;
      select.innerHTML = products.map(p => `
        <option value="${p.id}">${p.id}. ${p.name} (${p.desc || ''})</option>
      `).join("");
      if (currentVal && products.some(p => p.id === currentVal)) {
        select.value = currentVal;
      }
    }

    let cachedPOList = [];
    let currentPOTab = 'active';

    function switchPOTab(tab) {
      currentPOTab = tab;
      const activeView = document.getElementById("po-view-active");
      const histView = document.getElementById("po-view-history");
      const btnActive = document.getElementById("po-tab-btn-active");
      const btnHist = document.getElementById("po-tab-btn-history");

    function handleSingleReceiptTypeChange() {

    function calculateSingleReceiptShortage() {
      if (!currentSinglePO) return;
      const type = document.querySelector('input[name="sr-action-type"]:checked').value;
      const rawVal = document.getElementById("sr-received-qty").value;
      const recQty = (rawVal === "" || rawVal === null) ? null : Number(rawVal);
      const originalQty = currentSinglePO.qty;
      const hint = document.getElementById("sr-shortage-hint");

      if (type === "SHORT_CLOSE") {
        if (recQty === null || isNaN(recQty) || recQty < 0) {
          hint.innerText = "請輸入本次實收數量（若全數不來請填 0）";
          hint.style.color = "#dc2626";
        } else if (recQty === 0) {
          hint.innerText = `本次實收 0 套（整筆不會來了），原請購 ${originalQty} 套將全數強制結案清零，在庫不增，在途立即移出！`;
          hint.style.color = "#d97706";
        } else if (recQty >= originalQty) {
          hint.innerText = `實收數量已等於或大於原請購數 (${originalQty})，建議切換為【完工全數到貨】`;
          hint.style.color = "#2563eb";
        } else {
          const shortage = originalQty - recQty;
          hint.innerText = `本次實收 ${recQty} 套入庫，短交 ${shortage} 套強制結案不再補，在途數量立即清零！`;
          hint.style.color = "#b45309";
        }
      } else if (type === "SHORT_KEEP") {
        if (recQty === null || isNaN(recQty) || recQty <= 0) {
          hint.innerText = "短交保留在途模式請輸入大於 0 之實收到貨數量（若尚未到貨請維持在途即可）";
          hint.style.color = "#dc2626";
        } else if (recQty >= originalQty) {
          hint.innerText = `實收數量已等於或大於原請購數 (${originalQty})，建議切換為【完工全數到貨】`;
          hint.style.color = "#2563eb";
        } else {
          const shortage = originalQty - recQty;
          hint.innerText = `本次實收 ${recQty} 套入庫，剩餘 ${shortage} 套繼續保留在途清單待送`;
          hint.style.color = "#0369a1";
        }
      } else {
        hint.innerText = "";
      }
    }

    function submitSingleReceipt() {
      if (!currentSinglePO) return;
      const type = document.querySelector('input[name="sr-action-type"]:checked').value;
      const rawVal = document.getElementById("sr-received-qty").value;
      const recQty = (rawVal === "" || rawVal === null) ? NaN : Number(rawVal);
      const originalQty = currentSinglePO.qty;
      const userNote = document.getElementById("sr-note").value.trim();

      if (isNaN(recQty) || recQty < 0) {
        alert("請輸入有效的實收數量！");
        return;
      }

      if (type === "FULL" && recQty <= 0) {
        alert("全數到貨之實收數量必須大於 0！");
        return;
      }

      if (type === "SHORT_KEEP" && recQty <= 0) {
        alert("短交保留在途模式下，本次實收數量必須大於 0！（若尚未到貨請維持在途即可，無需點交）");
        return;
      }

      let shortageQty = 0;
      if (type === "SHORT_CLOSE" || type === "SHORT_KEEP") {
        if (recQty >= originalQty) {
          alert(`實收數量已達原採購量 (${originalQty})，請選擇【完工全數到貨】！`);
          return;
        }
        shortageQty = originalQty - recQty;
      }

      const todayStr = new Date().toISOString().substring(0, 10).replace(/-/g, "/");
      const recNo = "REC-" + new Date().toISOString().substring(0, 10).replace(/-/g, "");

      const receiptPayload = {
        receiptNo: recNo,
        receiptDate: todayStr,
        vendorName: "現場點交",
        items: [{
          itemCode: currentSinglePO.itemCode,
          itemName: currentSinglePO.itemName,
          receivedQty: recQty,
          poNumber: currentSinglePO.poNumber,
          actionType: type,
          originalPoQty: originalQty,
          shortageQty: shortageQty,
          note: userNote
        }]
      };

      let actionText = "";
      if (type === "FULL") {
        actionText = "全數到貨入庫";
      } else if (type === "SHORT_CLOSE") {
        actionText = (recQty === 0) 
          ? `整筆未到貨結案 (實收 0，短少 ${shortageQty})` 
          : `實收 ${recQty}，短交 ${shortageQty} 結案不再補`;
      } else {
        actionText = `實收 ${recQty}，短交 ${shortageQty} 保留在途`;
      }

      const confirmMsg = (recQty === 0)
        ? `確定要將採購單 [${currentSinglePO.poNumber}] 執行【${actionText}】嗎？\n在途將全數清零移出，避免卡單與超賣！`
        : `確定要將採購單 [${currentSinglePO.poNumber}] 執行【${actionText}】嗎？\n在庫庫存將即時增加 ${recQty}！`;

      if (!confirm(confirmMsg)) return;

      showLoading(true, "正在執行點交入庫並重新試算推移...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          closeSingleReceiptModal();
          loadDashboard(); // 重新整理所有看板與清冊
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("點交入庫失敗: " + err);
        })
        .api_processGoodsReceipt(receiptPayload, currentUser);
    }

    // 處理採購/進貨檔案直傳 (支援 SheetJS 多工作表解析，相容 PURI05_2.XLSX)
    let parsedPOPreviewList = [];

    // Excel 日期序號或文字轉 YYYY-MM-DD
    function parseExcelDate(val) {
      if (!val) return "";
      if (typeof val === "number") {
        // Excel 序列號轉換
        const utcDays = Math.floor(val - 25569);
        const dateObj = new Date(utcDays * 86400 * 1000);
        return dateObj.toISOString().substring(0, 10);
      }
      const s = String(val).trim().replace(/-/g, "/");
      if (/^\d{8}$/.test(s)) {
        return `${s.substring(0, 4)}-${s.substring(4, 6)}-${s.substring(6, 8)}`;
      }
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      return "";
    }

    // 將日期加上指定天數回傳 YYYY-MM-DD
    function addDaysToDateStr(dateStr, days) {
      if (!dateStr) return "";
      const parts = dateStr.replace(/-/g, "/").split("/");
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(d.getTime())) return "";
      d.setDate(d.getDate() + Number(days));
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function handlePOFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      showLoading(true, `正在以 SheetJS 智慧解析進貨單 ${file.name}...`);
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          
          let masterOrderNo = "";
          let targetSheetName = workbook.SheetNames[0];

          // 智慧工作表偵測 (支援 PURI05_2.XLSX 等多 sheet 架構)
          for (let sName of workbook.SheetNames) {
            const tempSheet = workbook.Sheets[sName];
            const tempRows = XLSX.utils.sheet_to_json(tempSheet, { header: 1, defval: "" });
            if (tempRows && tempRows.length > 0) {
              const rowStr = tempRows.map(r => r.join(" ")).join(" ");
              // 若找到請購單號且尚未取得 masterOrderNo
              if (rowStr.includes("請購單號") && !masterOrderNo) {
                for (let r of tempRows) {
                  for (let i = 0; i < r.length; i++) {
                    if (String(r[i]).includes("請購單號") && tempRows[tempRows.indexOf(r) + 1]) {
                      const nextRow = tempRows[tempRows.indexOf(r) + 1];
                      if (nextRow[i]) masterOrderNo = String(nextRow[i]).trim();
                    }
                  }
                }
              }
              // 若包含品號與數量，則此 sheet 為明細主工作表
              if (rowStr.includes("品號") && (rowStr.includes("請購數量") || rowStr.includes("數量"))) {
                targetSheetName = sName;
              }
            }
          }

          const activeSheet = workbook.Sheets[targetSheetName];
          const rows = XLSX.utils.sheet_to_json(activeSheet, { header: 1, defval: "" });
          parseRawPORows(rows, masterOrderNo);
        } catch (err) {
          showLoading(false);
          alert("進貨單檔案解析失敗: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = "";
    }

    // 處理貼上之採購文字 (TSV/CSV)
    function parsePastedPOText() {
      const text = document.getElementById("po-paste-text").value.trim();
      if (!text) {
        alert("請先貼上採購單內容！");
        return;
      }
      const lines = text.split(/\r?\n/);
      const rows = lines.map(line => line.split(line.includes("\t") ? "\t" : ","));
      parseRawPORows(rows, "");
    }

    // 解析二維陣列採購資料 (自動對齊表頭欄位並計算 需求日+20天 補貨日)
    function parseRawPORows(rows, defaultMasterNo) {
      showLoading(true, "檢驗進貨單明細與計算補貨日中...");
      if (!rows || rows.length === 0) {
        showLoading(false);
        alert("單據內容為空！");
        return;
      }

      // 智慧防呆偵測：若使用者誤將「ERP 在庫庫存表」(如 DIY全庫存.xlsx) 上傳至此處
      for (let i = 0; i < Math.min(rows.length, 5); i++) {
        const rowStr = (rows[i] || []).join(" ");
        if (rowStr.includes("庫存數量") || (rowStr.includes("庫別") && rowStr.includes("品號"))) {
          showLoading(false);
          alert("⚠️ 系統偵測到此檔案為【ERP 在庫庫存表】(如 DIY全庫存.xlsx)！\n\n此處為【在途採購/請購單據】匯入專區（用以登記廠商未到貨之在途訂單）。\n\n若您要更新 ERP 在庫庫存底數，請切換至：\n👉【📦 庫存盤點與 ERP 帳面】➔【📥 ERP 檔案直傳與自動清洗】\n系統將自動篩選 640 倉並更新在庫帳面，避免庫存重複累加！");
          return;
        }
      }

      // 智慧辨識表頭列
      let headerRowIndex = -1;
      for (let i = 0; i < Math.min(rows.length, 5); i++) {
        const rowStr = rows[i].join(" ");
        if (rowStr.includes("品號") && (rowStr.includes("數量") || rowStr.includes("請購數量"))) {
          headerRowIndex = i;
          break;
        }
      }

      let reqNoCol = -1, itemCodeCol = -1, itemNameCol = -1, specCol = -1, qtyCol = -1, reqDateCol = -1;

      if (headerRowIndex !== -1) {
        const headerRow = rows[headerRowIndex];
        headerRow.forEach((col, idx) => {
          const str = String(col).trim();
          if (str.includes("請購單號") || str.includes("採購單號") || str.includes("單號")) reqNoCol = idx;
          if (str === "品號" || str.includes("材料品號") || str.includes("料號")) itemCodeCol = idx;
          if (str === "品名" || str.includes("材料名稱")) itemNameCol = idx;
          if (str === "規格" || str.includes("規格說明")) specCol = idx;
          if (str.includes("請購數量") || str === "數量" || str.includes("採購數量")) qtyCol = idx;
          if (str.includes("需求日期") || str.includes("到貨日") || str.includes("預計到貨")) reqDateCol = idx;
        });
      }

      const dataRows = (headerRowIndex !== -1) ? rows.slice(headerRowIndex + 1) : rows;
      parsedPOPreviewList = [];
      const masterList = (cachedDashboardData && cachedDashboardData.materials) ? cachedDashboardData.materials : [];
      const todayStr = new Date().toISOString().substring(0, 10);

      dataRows.forEach((r, idx) => {
        if (!r || r.length < 2) return;

        let reqNo = defaultMasterNo || "";
        let itemCode = "";
        let itemName = "";
        let specStr = "";
        let qty = 0;
        let reqDate = todayStr;

        if (headerRowIndex !== -1) {
          if (reqNoCol !== -1 && r[reqNoCol]) reqNo = String(r[reqNoCol]).trim();
          if (itemCodeCol !== -1) itemCode = String(r[itemCodeCol]).trim();
          if (itemNameCol !== -1) itemName = String(r[itemNameCol]).trim();
          if (specCol !== -1 && r[specCol]) specStr = String(r[specCol]).trim();
          if (qtyCol !== -1) qty = Number(r[qtyCol]) || 0;
          if (reqDateCol !== -1 && r[reqDateCol]) {
            const parsedD = parseExcelDate(r[reqDateCol]);
            if (parsedD) reqDate = parsedD;
          }
        } else {
          // 容錯順序: 單號, 品號, 數量, 需求日
          if (String(r[0]).length >= 8 && isNaN(Number(r[1])) === false) {
            reqNo = String(r[0]).trim();
            itemCode = String(r[1]).trim();
            qty = Number(r[2]) || 0;
            reqDate = parseExcelDate(r[3]) || todayStr;
          } else {
            itemCode = String(r[0]).trim();
            qty = Number(r[1]) || 0;
            reqDate = parseExcelDate(r[2]) || todayStr;
          }
        }

        if (!itemCode || qty <= 0) return;

        // 計算關鍵補貨日 = 需求日期 + 20 天 (需求 4)
        const arrivalDate = addDaysToDateStr(reqDate, 20) || addDaysToDateStr(todayStr, 20);

        // 比對品名
        const matched = masterList.find(m => m.itemCode === itemCode);
        if (!itemName) {
          itemName = matched ? matched.itemName : itemCode;
        }

        let noteStr = `需求日:${reqDate}`;
        if (specStr) noteStr += ` | 規格:${specStr}`;
        noteStr += ` (+20天到貨)`;

        parsedPOPreviewList.push({
          reqNo: reqNo,
          itemCode: itemCode,
          itemName: itemName,
          spec: specStr,
          qty: qty,
          reqDate: reqDate,
          arrivalDate: arrivalDate, // 需求日 + 20 天
          note: noteStr,
          isMatched: !!matched
        });
      });

      showLoading(false);
      if (parsedPOPreviewList.length === 0) {
        alert("未解析出任何有效進貨明細 (請確認包含品號與大於 0 的請購數量)！");
        return;
      }
      renderPOPreview();
    }

    // ==================== 📥 進貨驗收單解析、比對與核銷入庫 JS ====================
    let currentReceiptCompareData = null; // 當前正在對比的進貨單資料

    function handleReceiptFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      showLoading(true, `正在以 SheetJS 智慧解析進貨單 ${file.name}...`);
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          
          let receiptNo = "";
          let receiptDate = "";
          let vendorName = "";
          let targetSheetName = workbook.SheetNames[0];

          // 1. 掃描各工作表，提取主單資訊 (進貨單號、進貨日期、供應廠商)
          for (let sName of workbook.SheetNames) {
            const tempSheet = workbook.Sheets[sName];
            const tempRows = XLSX.utils.sheet_to_json(tempSheet, { header: 1, defval: "" });
            if (tempRows && tempRows.length > 0) {
              const fullStr = tempRows.map(r => r.join(" ")).join(" ");
              // 找進貨單號與廠商
              if (fullStr.includes("進貨單號") && !receiptNo) {
                for (let rIdx = 0; rIdx < tempRows.length; rIdx++) {
                  const r = tempRows[rIdx];
                  for (let cIdx = 0; cIdx < r.length; cIdx++) {
                    const cStr = String(r[cIdx]).trim();
                    if (cStr === "進貨單號" && tempRows[rIdx + 1] && tempRows[rIdx + 1][cIdx]) {
                      receiptNo = String(tempRows[rIdx + 1][cIdx]).trim();
                    }
                    if (cStr === "進貨日期" && tempRows[rIdx + 1] && tempRows[rIdx + 1][cIdx]) {
                      receiptDate = parseExcelDate(tempRows[rIdx + 1][cIdx]);
                    }
                    if ((cStr === "供應廠商名稱" || cStr === "供應廠商") && tempRows[rIdx + 1] && tempRows[rIdx + 1][cIdx]) {
                      vendorName = String(tempRows[rIdx + 1][cIdx]).trim();
                    }
                  }
                }
              }
              // 判斷是否為明細表 (包含品號與 驗收數量 或 進貨數量)
              if (fullStr.includes("品號") && (fullStr.includes("驗收數量") || fullStr.includes("進貨數量") || fullStr.includes("數量"))) {
                targetSheetName = sName;
              }
            }
          }

          const activeSheet = workbook.Sheets[targetSheetName];
          const rows = XLSX.utils.sheet_to_json(activeSheet, { header: 1, defval: "" });
          parseRawReceiptRows(rows, { receiptNo, receiptDate, vendorName });
        } catch (err) {
          showLoading(false);
          alert("進貨單檔案解析失敗: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = "";
    }

    function parsePastedReceiptText() {
      const text = document.getElementById("receipt-paste-text").value.trim();
      if (!text) {
        alert("請先貼上進貨單內容！");
        return;
      }
      const lines = text.split(/\r?\n/);
      const rows = lines.map(line => line.split(line.includes("\t") ? "\t" : ","));
      parseRawReceiptRows(rows, { receiptNo: "", receiptDate: "", vendorName: "" });
    }

    function parseRawReceiptRows(rows, headerMeta) {
      if (!rows || rows.length === 0) {
        showLoading(false);
        alert("進貨單內容為空！");
        return;
      }

      // 辨識明細表頭
      let headerRowIndex = -1;
      for (let i = 0; i < Math.min(rows.length, 5); i++) {
        const rowStr = rows[i].join(" ");
        if (rowStr.includes("品號") && (rowStr.includes("驗收數量") || rowStr.includes("進貨數量") || rowStr.includes("數量"))) {
          headerRowIndex = i;
          break;
        }
      }

      let itemCodeCol = -1, itemNameCol = -1, specCol = -1, recQtyCol = -1, poNoCol = -1, recNoCol = -1;

      if (headerRowIndex !== -1) {
        const headerRow = rows[headerRowIndex];
        headerRow.forEach((col, idx) => {
          const str = String(col).trim();
          if (str === "品號" || str.includes("材料品號") || str.includes("料號")) itemCodeCol = idx;
          if (str === "品名" || str.includes("材料名稱")) itemNameCol = idx;
          if (str === "規格" || str.includes("規格說明")) specCol = idx;
          if (str === "驗收數量" || str === "進貨數量" || str.includes("實收數量")) recQtyCol = idx;
          if (str === "採購單號" || str.includes("請購單號") || str.includes("採購單別")) {
            if (str === "採購單號" || poNoCol === -1) poNoCol = idx;
          }
          if (str === "進貨單號" || str.includes("驗收單號")) recNoCol = idx;
        });
      }

      const dataRows = (headerRowIndex !== -1) ? rows.slice(headerRowIndex + 1) : rows;
      const parsedItems = [];
      const masterList = (cachedDashboardData && cachedDashboardData.materials) ? cachedDashboardData.materials : [];

      dataRows.forEach(r => {
        if (!r || r.length < 2) return;
        let itemCode = "";
        let itemName = "";
        let specStr = "";
        let recQty = 0;
        let poNo = "";
        let rowRecNo = headerMeta.receiptNo || "";

        if (headerRowIndex !== -1) {
          if (itemCodeCol !== -1) itemCode = String(r[itemCodeCol]).trim();
          if (itemNameCol !== -1) itemName = String(r[itemNameCol]).trim();
          if (specCol !== -1) specStr = String(r[specCol]).trim();
          if (recQtyCol !== -1) recQty = Number(r[recQtyCol]) || 0;
          if (poNoCol !== -1 && r[poNoCol]) poNo = String(r[poNoCol]).trim();
          if (recNoCol !== -1 && r[recNoCol]) rowRecNo = String(r[recNoCol]).trim();
        } else {
          itemCode = String(r[0] || "").trim();
          itemName = String(r[1] || "").trim();
          recQty = Number(r[2]) || 0;
          poNo = String(r[3] || "").trim();
        }

        if (!itemCode || recQty <= 0) return;

        // 比對品名
        const matched = masterList.find(m => m.itemCode === itemCode);
        if (!itemName) {
          itemName = matched ? matched.itemName : itemCode;
        }

        parsedItems.push({
          itemCode: itemCode,
          itemName: itemName,
          spec: specStr,
          receivedQty: recQty,
          poNumber: poNo,
          receiptNo: rowRecNo
        });
      });

      showLoading(false);
      if (parsedItems.length === 0) {
        alert("未解析出任何有效進貨明細 (需包含品號與大於 0 之驗收數量)！");
        return;
      }

      const finalRecNo = headerMeta.receiptNo || (parsedItems[0] && parsedItems[0].receiptNo) || "GR-" + new Date().toISOString().substring(0,10).replace(/-/g,"");
      const finalRecDate = headerMeta.receiptDate || new Date().toISOString().substring(0,10);
      const finalVendor = headerMeta.vendorName || "合作廠商";

      compareAndOpenReceiptModal({
        receiptNo: finalRecNo,
        receiptDate: finalRecDate,
        vendorName: finalVendor
      }, parsedItems);
    }

    // 比對進貨明細與在途採購清冊，並打開比對確認彈窗
    function compareAndOpenReceiptModal(receiptMeta, items) {
      const activePOs = (cachedPOList || []).filter(p => {
        const s = String(p.status || "").trim();
        return !s.includes("已到貨") && !s.includes("已取消");
      });

      let fullCount = 0;
      let shortCount = 0;
      let directCount = 0;

      const comparedItems = items.map(it => {
        const itPo = String(it.poNumber || "").trim();
        const itCode = String(it.itemCode || "").trim();
        const itQty = Number(it.receivedQty) || 0;

        let matchedPO = null;
        if (itPo) {
          matchedPO = activePOs.find(p => {
            const pPo = String(p.poNumber || "").trim();
            const pCode = String(p.itemCode || "").trim();
            return (pPo === itPo || (pPo && itPo && (pPo.includes(itPo) || itPo.includes(pPo)))) && pCode === itCode;
          });
        }
        // 若以單號找不到，嘗試以未結案品號兜底匹配
        if (!matchedPO) {
          matchedPO = activePOs.find(p => String(p.itemCode || "").trim() === itCode);
        }

        let originalPoQty = matchedPO ? (Number(matchedPO.qty) || 0) : 0;
        let poNo = matchedPO ? String(matchedPO.poNumber || "") : itPo;
        let matchType = "DIRECT";
        let shortageQty = 0;

        if (matchedPO) {
          if (itQty >= originalPoQty) {
            matchType = "FULL";
            fullCount++;
          } else {
            matchType = "SHORT_CLOSE"; // 短交預設結案不再補，防業務超賣
            shortageQty = originalPoQty - itQty;
            shortCount++;
          }
        } else {
          matchType = "DIRECT";
          directCount++;
        }

        return {
          itemCode: itCode,
          itemName: it.itemName,
          spec: it.spec,
          receivedQty: itQty,
          poNumber: poNo,
          originalPoQty: originalPoQty,
          matchType: matchType,
          shortageQty: shortageQty,
          actionType: matchType
        };
      });

      currentReceiptCompareData = {
        receiptNo: receiptMeta.receiptNo,
        receiptDate: receiptMeta.receiptDate,
        vendorName: receiptMeta.vendorName,
        items: comparedItems
      };

      // 渲染彈窗內容
      document.getElementById("gr-modal-no").innerText = receiptMeta.receiptNo;
      document.getElementById("gr-modal-date").innerText = receiptMeta.receiptDate;
      document.getElementById("gr-modal-vendor").innerText = receiptMeta.vendorName || "未指定廠商";
      document.getElementById("gr-summary-badge").innerText = `共 ${comparedItems.length} 項 (全數到貨 ${fullCount} / 短交不足 ${shortCount} / 直接配貨 ${directCount})`;

      const tbody = document.getElementById("gr-compare-tbody");
      tbody.innerHTML = comparedItems.map((item, idx) => {
        let statusBadge = "";
        let actionControl = "";

        if (item.matchType === "FULL") {
          statusBadge = '<span class="status-badge GREEN">🟢 完工全數到貨</span>';
          actionControl = '<span style="color:#10b981; font-weight:600;">採購單整筆結案 (在庫+' + item.receivedQty + ')</span>';
        } else if (item.matchType === "SHORT_CLOSE") {
          statusBadge = `<span class="status-badge YELLOW">🟡 短交不足 (少 ${item.shortageQty})</span>`;
          actionControl = `
            <select class="form-select" style="font-size:12px; padding:3px 6px;" onchange="currentReceiptCompareData.items[${idx}].actionType = this.value">
              <option value="SHORT_CLOSE" selected>🔘 結案不再補 (剩餘在途清零)</option>
              <option value="SHORT_KEEP">⚪ 保留在途 (等待下批補寄)</option>
            </select>
          `;
        } else {
          statusBadge = '<span class="status-badge" style="background:#8b5cf6; color:white;">🟣 直接配貨進貨</span>';
          actionControl = '<span style="color:#8b5cf6; font-weight:600;">無採購單，實收認列入庫 (+' + item.receivedQty + ')</span>';
        }

        return `
          <tr>
            <td><span class="booking-code-tag">${item.poNumber || '無前置採購'}</span></td>
            <td>
              <div style="font-weight:700; color:#1e293b; font-size:13px;">${item.itemCode} / ${item.itemName}</div>
              ${item.spec ? `<div style="font-size:11px; color:#64748b;">規格:${item.spec}</div>` : ''}
            </td>
            <td style="text-align:center; color:#64748b; font-weight:600;">${item.originalPoQty > 0 ? item.originalPoQty : '-'}</td>
            <td style="text-align:center; font-size:15px; font-weight:800; color:#10b981;">+${item.receivedQty}</td>
            <td>${statusBadge}</td>
            <td>${actionControl}</td>
          </tr>
        `;
      }).join("");

      document.getElementById("modal-receipt-compare").style.display = "flex";
    }

    // 星期標記輔助
    function getBookingWeekdayTag(dateStr) {
      if (!dateStr) return "";
      try {
        const d = new Date(dateStr.replace(/\//g, "-"));
        if (isNaN(d.getTime())) return "";
        const day = d.getDay();
        const names = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
        const isWeekend = (day === 0 || day === 6);
        return `<span class="weekday-tag ${isWeekend ? 'weekend' : 'weekday'}">${names[day]}</span>`;
      } catch (e) {
        return "";
      }
    }

    // 即時篩選清冊 (關鍵字 + 燈號狀態 + 排除過期預約 + 日期較前在最上方)
    function filterBookingTable() {
      const keyword = (document.getElementById("booking-search-input") ? document.getElementById("booking-search-input").value : "").trim().toLowerCase();
      const statusFilter = (document.getElementById("booking-filter-status") ? document.getElementById("booking-filter-status").value : "ALL");

      // 取得今天日期字串 (yyyy/MM/dd)
      const now = new Date();
      const todayStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;

      let filtered = cachedBookingList || [];

      // 1. 預約日期已過的不用再顯示在欄位上 (過濾 eventDate < 今天)
      filtered = filtered.filter(b => {
        const bDate = String(b.eventDate || "").replace(/-/g, "/").substring(0, 10);
        return bDate >= todayStr;
      });

      // 2. 狀態燈號篩選
      if (statusFilter !== "ALL") {
        filtered = filtered.filter(b => b.light === statusFilter);
      }

      // 3. 關鍵字搜尋
      if (keyword) {
        filtered = filtered.filter(b => 
          String(b.bookingNo || "").toLowerCase().includes(keyword) ||
          String(b.groupName || "").toLowerCase().includes(keyword) ||
          String(b.phone || "").toLowerCase().includes(keyword) ||
          String(b.productName || "").toLowerCase().includes(keyword) ||
          String(b.note || "").toLowerCase().includes(keyword) ||
          String(b.eventDate || "").includes(keyword)
        );
      }

      // 4. 排序：活動日期較前的在最上方 (由近到遠升冪排序)
      filtered.sort((a, b) => {
        const d1 = String(a.eventDate || "").replace(/-/g, "/");
        const d2 = String(b.eventDate || "").replace(/-/g, "/");
        const diff = d1.localeCompare(d2);
        if (diff !== 0) return diff;
        return String(a.createdAt || a.bookingNo || "").localeCompare(String(b.createdAt || b.bookingNo || ""));
      });

      const totalBadge = document.getElementById("booking-total-badge");
      if (totalBadge) {
        if (keyword || statusFilter !== "ALL") {
          totalBadge.innerText = `符合 ${filtered.length} 筆 (有效共 ${filtered.length} 筆)`;
        } else {
          totalBadge.innerText = `共 ${filtered.length} 筆預約`;
        }
      }

      renderBookingTableOnly(filtered);
    }

    function renderBookingTableOnly(bookings) {

    // 渲染預約清單至業務接單頁面與庫管缺口清冊
    function renderBookingList(bookings) {
      cachedBookingList = bookings || [];
      const shortageTbody = document.getElementById("booking-shortage-tbody");

      // 觸發業務端清冊渲染
      filterBookingTable();

      // 彙整有缺口之預約 (庫管端缺口提醒清冊，需求 3)
      if (shortageTbody) {
        const shortages = bookings.filter(b => b.light === "YELLOW" || String(b.procurementStatus).includes("尚缺"));

          shortageTbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#059669; font-weight:600; padding:16px 10px;">🎉 目前所有預約物料皆充足，無庫存缺口！</td></tr>';

          shortageTbody.innerHTML = shortages.map(b => `

              <td><b>${escapeHtml(b.eventDate)}</b></td>

              <td>${escapeHtml(b.groupName)} (${escapeHtml(b.phone || "-")})</td>

    // 開啟預約編輯彈窗 (支援 rowIndex 優先定位)
    function openBookingEditModal(bookingNo, rowIndex) {
      const item = (rowIndex && cachedBookingList)
        ? (cachedBookingList.find(b => b.rowIndex === rowIndex) || cachedBookingList.find(b => b.bookingNo === bookingNo))
        : (cachedBookingList ? cachedBookingList.find(b => b.bookingNo === bookingNo) : null);
      if (!item) {
        alert("找不到此預約紀錄！");
        return;
      }

      if (document.getElementById("edit-bk-row-index")) {
        document.getElementById("edit-bk-row-index").value = item.rowIndex || "";
      }
      document.getElementById("edit-bk-no").value = item.bookingNo;
      document.getElementById("edit-bk-date").value = item.eventDate.replace(/\//g, "-");
      document.getElementById("edit-bk-qty").value = item.qty;
      document.getElementById("edit-bk-group").value = item.groupName;
      document.getElementById("edit-bk-phone").value = item.phone;
      document.getElementById("edit-bk-note").value = item.note || "";

      // 填入商品選單
      const select = document.getElementById("edit-bk-product");
      const products = (cachedDashboardData && cachedDashboardData.products && cachedDashboardData.products.length > 0)
        ? cachedDashboardData.products : [];
      if (products.length === 0) {
        select.innerHTML = '<option value="">⚠ 無商品資料，請先返回重新整理</option>';
      } else {
        select.innerHTML = products.map(p => `
          <option value="${escapeHtml(p.name)}" ${String(item.productName || '').includes(p.name) ? 'selected' : ''}>${escapeHtml(p.name)}</option>
        `).join("");
      }

      document.getElementById("modal-booking-editor").style.display = "flex";
    }

    function closeBookingEditModal() {
      document.getElementById("modal-booking-editor").style.display = "none";
    }

    // 送出預約修改
    function submitUpdateBooking() {
      const rowIndex = document.getElementById("edit-bk-row-index") ? document.getElementById("edit-bk-row-index").value : "";
      const bookingNo = document.getElementById("edit-bk-no").value.trim();
      const eventDate = document.getElementById("edit-bk-date").value;
      const qty = Number(document.getElementById("edit-bk-qty").value) || 0;
      const productName = document.getElementById("edit-bk-product").value;
      const groupName = document.getElementById("edit-bk-group").value.trim();
      const phone = document.getElementById("edit-bk-phone").value.trim();
      const note = document.getElementById("edit-bk-note").value.trim();

      if (!eventDate || qty <= 0) {
        alert("請確認活動日期與套數大於 0！");
        return;
      }

      showLoading(true, `正在儲存預約單 [${bookingNo}] 修改內容...`);
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          if (res.success) {
            closeBookingEditModal();
            loadDashboard();
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("修改預約失敗: " + err);
        })
        .api_updateBooking({
          bookingNo: bookingNo,
          rowIndex: rowIndex,
          eventDate: eventDate,
          qty: qty,
          productName: productName,
          groupName: groupName,
          phone: phone,
          note: note
        }, currentUser);
    }

    // 刪除預約 (支援 rowIndex)
    function deleteBookingItem(bookingNo, rowIndex) {
      if (!confirm(`確定要刪除預約單 [${bookingNo}] 嗎？\n刪除後預約套數將立即釋放回庫存中！`)) return;

      showLoading(true, `正在刪除預約單 [${bookingNo}]...`);
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          if (res.success) {
            loadDashboard();
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("刪除預約失敗: " + err);
        })
        .api_deleteBooking(bookingNo, rowIndex, currentUser);

    // ==================== 🎨 商品與 BOM 配方維護中心 JS ====================
    let cachedBOMData = null;

    function loadBOMManagement() {
      showLoading(true, "載入商品與 BOM 配方清冊中...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          if (!res.success) {
            alert("❌ " + res.message);
            return;
          }
          cachedBOMData = res;
          renderBOMProducts(res.products, res.bomRules);
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("載入 BOM 失敗: " + err);
        })
        .api_getAllProductsAndBOM();
    }

    function renderBOMProducts(products, bomRules) {
      const container = document.getElementById("bom-products-container");
      if (!products || products.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">目前無商品資料</div>';
        return;
      }

      const ruleMap = {};
      (bomRules || []).forEach(r => {
        if (!ruleMap[r.productId]) ruleMap[r.productId] = [];
        ruleMap[r.productId].push(r);
      });

      container.innerHTML = products.map(p => {
        const rules = ruleMap[p.id] || [];
        const isBuiltin = !!p.isBuiltin;  // 由後端 getDynamicProductsAndBOM 動態標記，不寫死 ID 範圍
        const rulesBadges = rules.map(r => `
          <span style="display:inline-block; background:#f1f5f9; border:1px solid #cbd5e1; padding:3px 8px; border-radius:6px; font-size:12px; margin:2px 4px 2px 0;">
            <b>${r.category}</b> × ${r.qty} <span style="color:#64748b;">(${formatSharedLabel(r.note || '')})</span>
          </span>
        `).join("");

        const deleteBtn = isBuiltin ? '' : `
          <button class="btn btn-danger btn-sm" onclick="handleDeleteProduct('${p.id}', '${p.name}')">
            🗑️ 刪除商品
          </button>
        `;

        return `
          <div class="card" style="border-left: 4px solid var(--primary); margin-bottom: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px;">
              <div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="background:var(--primary-light); color:var(--primary); font-weight:700; padding:2px 8px; border-radius:6px; font-size:12px;">ID: ${p.id}</span>
                  <strong style="font-size: 16px; color: #1e293b;">${p.name}</strong>
                  ${isBuiltin ? '<span style="font-size:11px; background:#e0e7ff; color:#3730a3; padding:2px 6px; border-radius:4px;">經典內建商品</span>' : '<span style="font-size:11px; background:#dcfce7; color:#166534; padding:2px 6px; border-radius:4px;">自訂DIY商品</span>'}
                </div>
                <p style="font-size: 13px; color: #64748b; margin-top: 4px;">${p.desc || ''}</p>
              </div>
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-outline btn-sm" onclick="openEditProductModal('${p.id}')">
                  ✏️ 編輯商品與配方
                </button>
                ${deleteBtn}
              </div>
            </div>
            <div style="margin-top: 10px; border-top: 1px dashed #e2e8f0; padding-top: 8px;">
              <div style="font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px;">
                🧩 單份耗用材料組成 (${rules.length} 項部件)：
              </div>
              <div>${rulesBadges || '<span style="color:#94a3b8; font-size:12px;">暫無配方</span>'}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openNewProductModal() {
      document.getElementById("bom-modal-title").innerText = "➕ 新增 DIY 體驗商品與配方";
      document.getElementById("bom-input-id").value = "";
      document.getElementById("bom-input-id").disabled = false;
      document.getElementById("bom-input-name").value = "";
      document.getElementById("bom-input-desc").value = "";
      document.getElementById("bom-items-tbody").innerHTML = "";
      addBOMItemRow();
      document.getElementById("modal-bom-editor").style.display = "flex";
    }

    function openEditProductModal(productId) {
      if (!cachedBOMData) return;
      const prod = cachedBOMData.products.find(p => p.id === productId);
      if (!prod) return;

      document.getElementById("bom-modal-title").innerText = `✏️ 編輯【${prod.name}】與配方`;
      document.getElementById("bom-input-id").value = prod.id;
      document.getElementById("bom-input-id").disabled = true; // 既有商品不可改代碼
      document.getElementById("bom-input-name").value = prod.name;
      document.getElementById("bom-input-desc").value = prod.desc || "";

      const rules = cachedBOMData.bomRules.filter(r => r.productId === productId);
      const activeCats = new Set((cachedBOMData.availableCategories || []).map(c => String(c).trim()));
      const activeCodes = new Set((cachedBOMData.masterMaterials || []).map(m => String(m.itemCode).trim()));
      // 僅載入有效啟用中材料之配方 (已停用料在 BOM 表內不見)
      const validRules = rules.filter(r => {
        const cat = String(r.category || "").trim();
        return activeCats.has(cat) || activeCodes.has(cat);
      });

      const tbody = document.getElementById("bom-items-tbody");
      tbody.innerHTML = "";
      if (validRules.length === 0) {
        addBOMItemRow();
      } else {
        validRules.forEach(r => addBOMItemRow(r.category, r.qty, r.note));
      }
      document.getElementById("modal-bom-editor").style.display = "flex";
    }

    function closeBOMModal() {
      document.getElementById("modal-bom-editor").style.display = "none";
    }

    function addBOMItemRow(selectedCategory, qty, note) {
      const tbody = document.getElementById("bom-items-tbody");
      // fallback 改為空陣列，避免顯示過時的寫死分類清單；若真的無資料，select 會顯示「無可用分類，請重新整理」
      const cats = (cachedBOMData && cachedBOMData.availableCategories && cachedBOMData.availableCategories.length > 0)
        ? [...cachedBOMData.availableCategories]
        : [];
      const masterMaterials = (cachedBOMData && cachedBOMData.masterMaterials) ? [...cachedBOMData.masterMaterials] : [];

      // 依名稱排序分類群組 (問題 3)
      cats.sort((a, b) => a.localeCompare(b, "zh-Hant"));

      // 依種類代碼與品號排序具體品號 (問題 2 & 3)
      masterMaterials.sort((a, b) => {
        const catCmp = String(a.category || "").localeCompare(String(b.category || ""), "zh-Hant");
        if (catCmp !== 0) return catCmp;
        return String(a.itemCode || "").localeCompare(String(b.itemCode || ""));
      });

      let matchedAny = false;
      let optionsHtml = '<optgroup label="📦 材料種類代碼 (總量池群組)">';
      if (cats.length === 0) {
        optionsHtml += '<option value="" disabled>⚠ 無可用分類，請重新整理頁面</option>';
      }
      cats.forEach(c => {
        const isSel = (selectedCategory === c);
        if (isSel) matchedAny = true;
        optionsHtml += `<option value="${c}" ${isSel ? 'selected' : ''}>${c}</option>`;
      });
      optionsHtml += '</optgroup>';

      if (masterMaterials.length > 0) {
        optionsHtml += '<optgroup label="🔩 具體材料品號 (直屬 ERP 貨號品名)">';
        masterMaterials.forEach(m => {
          // 選取值直接以唯一 ERP 品號為值，徹底解決同分類選項 value 重複導致儲存後全部跳掉的 Bug (問題 4)
          const val = m.itemCode;
          const label = `${m.itemCode} - ${m.itemName} (${m.category})`;
          const isSel = (selectedCategory === m.itemCode || selectedCategory === m.category);
          if (isSel) matchedAny = true;
          optionsHtml += `<option value="${val}" ${isSel ? 'selected' : ''}>${label}</option>`;
        });
        optionsHtml += '</optgroup>';
      }

      // 若指定了 selectedCategory 但不在目前啟用清單中 (例如已被停用)，不應添加或胡亂跳選首項
      if (selectedCategory && !matchedAny) {
        return;
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <select class="form-select bom-row-category" style="padding:4px 6px; font-size:12px;">
            ${optionsHtml}
          </select>
        </td>
        <td>
          <input type="number" class="form-input bom-row-qty" style="padding:4px 6px; font-size:12px;" min="1" value="${qty || 1}">
        </td>
        <td>
          <input type="text" class="form-input bom-row-note" style="padding:4px 6px; font-size:12px;" value="${note || ''}" placeholder="例如：長側板4片">
        </td>
        <td style="text-align:center;">
          <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
    }

    function submitSaveProductAndBOM() {
      const pId = document.getElementById("bom-input-id").value.trim();
      const pName = document.getElementById("bom-input-name").value.trim();
      const pDesc = document.getElementById("bom-input-desc").value.trim();

      if (!pId || !pName) {
        alert("商品代碼與名稱為必填項目！");
        return;
      }

      const rows = document.querySelectorAll("#bom-items-tbody tr");
      const bomItems = [];
      rows.forEach(r => {
        const cat = r.querySelector(".bom-row-category").value;
        const q = Number(r.querySelector(".bom-row-qty").value) || 1;
        const n = r.querySelector(".bom-row-note").value.trim();
        if (cat) {
          bomItems.push({ category: cat, qty: q, note: n });
        }
      });

      if (bomItems.length === 0) {
        alert("請至少為此商品新增一項材料配方！");
        return;
      }

      showLoading(true, "儲存商品與 BOM 配方中...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          if (res.success) {
            closeBOMModal();
            loadBOMManagement();
            loadDashboard(); // 重新整理前台組數抽屜與業務下拉選單
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("儲存失敗: " + err);
        })
        .api_saveProductAndBOM({ id: pId, name: pName, desc: pDesc }, bomItems, currentUser);
    }

    function handleDeleteProduct(productId, name) {
      if (!confirm(`確定要刪除商品【${name}】(ID: ${productId}) 及其所有 BOM 配方嗎？\n此動作將同步影響業務接單選單與推移計算！`)) return;

      showLoading(true, "刪除商品中...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          loadBOMManagement();
          loadDashboard();
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("刪除失敗: " + err);
        })
        .api_deleteProduct(productId, currentUser);
    }

    // ==================== 原物料品號管理 (建立新材料/貨號品名) ====================
    let cachedMaterialsList = [];

    function loadMaterialsList() {
      const tbody = document.getElementById("materials-list-tbody");
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8;">載入原物料清單中...</td></tr>';
      }
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.success) {
            console.error("載入原物料失敗: " + res.message);
            return;
          }
          cachedMaterialsList = res.materials || [];
          renderMaterialsList(cachedMaterialsList);
          updateCategoryDatalist(res.categories || []);
        })
        .withFailureHandler(function(err) {
          console.error("載入原物料失敗: " + err);
        })
        .api_getAllMaterials();
    }

    function updateCategoryDatalist(categories) {
      const datalist = document.getElementById("mat-category-datalist");
      if (!datalist) return;
      datalist.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    function renderMaterialsList(materials) {
      const tbody = document.getElementById("materials-list-tbody");
      if (!tbody) return;

      if (!materials || materials.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding:16px;">目前尚無原物料資料</td></tr>';
        return;
      }

      // 依三階層排序：#材料種類代碼 ##ERP品號 ###品名規格
      materials.sort((a, b) => {
        const catCmp = String(a.category || "").localeCompare(String(b.category || ""), "zh-Hant");
        if (catCmp !== 0) return catCmp;
        const codeCmp = String(a.itemCode || "").localeCompare(String(b.itemCode || ""));
        if (codeCmp !== 0) return codeCmp;
        const nameA = `${a.itemName || ""} ${a.color || ""}`;
        const nameB = `${b.itemName || ""} ${b.color || ""}`;
        return nameA.localeCompare(nameB, "zh-Hant");
      });

      tbody.innerHTML = materials.map(m => {
        const isInactive = (m.status === "停用");
        return `
          <tr style="${isInactive ? 'opacity: 0.65; background: #f8fafc;' : ''}">
            <td><strong>${m.itemCode}</strong></td>
            <td>${m.itemName}</td>
            <td><span style="background:#e0f2fe; color:#0369a1; padding:2px 6px; border-radius:4px; font-size:12px; font-weight:600;">${m.category}</span></td>
            <td>${m.color || '-'}</td>
            <td style="font-size:12px; color:#64748b;">${m.note || '-'}</td>
            <td>
              <span class="status-badge ${isInactive ? 'RED' : 'GREEN'}" style="font-size:11px;">
                ${isInactive ? '⚪ 停用' : '🟢 啟用'}
              </span>
            </td>
            <td>
              <div style="display:flex; gap:4px;">
                <button class="btn btn-outline btn-sm" onclick="openEditMaterialModal('${m.itemCode}')">
                  ✏️ 編輯
                </button>
                <button class="btn ${isInactive ? 'btn-success' : 'btn-danger'} btn-sm" onclick="toggleMaterialStatus('${m.itemCode}', '${m.status}')">
                  ${isInactive ? '🟢 啟用' : '🔴 停用'}
                </button>
              </div>
            </td>
          </tr>

    // 初始化未來 45 天日期下拉選單
    function initProjectionDateSelect() {
      const select = document.getElementById("proj-date-select");
      if (!select) return;
      const today = new Date();
      select.innerHTML = "";

      for (let i = 1; i <= 45; i++) {
        const d = new Date(today.getTime() + i * 24 * 60 * 60 * 1000);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const dStr = `${y}/${m}/${day}`;
        const dayOfWeek = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"][d.getDay()];
        const isWe = (d.getDay() === 0 || d.getDay() === 6);
        const opt = document.createElement("option");
        opt.value = dStr;
        opt.innerText = `${dStr} (${dayOfWeek}${isWe ? " - 假日" : " - 平日"})`;
        select.appendChild(opt);
      }
      handleProjectionDateChange();
    }

    // ERP 檔案拖曳與解析
    function setupDragAndDrop() {
      const dropZone = document.getElementById("drop-zone");
      if (!dropZone) return;

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, e => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add("dragover");
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, e => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove("dragover");
        }, false);
      });

      dropZone.addEventListener('drop', e => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files && files.length > 0) {
          parseAndUploadERPFile(files[0]);
        }
      }, false);
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (file) {
        parseAndUploadERPFile(file);
      }
    }

    function parseAndUploadERPFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (!['xlsx', 'xls', 'csv'].includes(ext)) {
        alert("❌ 僅支援 .xlsx、.xls 或 .csv 格式之檔案！");
        return;
      }

      showLoading(true, `正在以 SheetJS 解析 ${file.name}...`);
      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

          if (!rows || rows.length <= 1) {
            showLoading(false);
            alert("檔案解析成功但無有效資料內容！");
            return;
          }

          showLoading(true, `檔案解析成功 (${rows.length} 列)，正在進行 640 倉過濾清洗與推移計算...`);

          google.script.run
            .withSuccessHandler(function(res) {
              showLoading(false);
              const alertBox = document.getElementById("upload-status-alert");
              if (res.success) {
                alertBox.style.display = "block";
                alertBox.style.background = "var(--green-bg)";
                alertBox.style.color = "#065f46";
                alertBox.style.border = "1px solid #a7f3d0";
                alertBox.innerText = res.message;
                alert(res.message);
                loadDashboard();
              } else {
                alertBox.style.display = "block";
                alertBox.style.background = "var(--red-bg)";
                alertBox.style.color = "#991b1b";
                alertBox.style.border = "1px solid #fecaca";
                alertBox.innerText = "❌ " + res.message;
                alert("上傳失敗: " + res.message);
              }
              document.getElementById("erp-file-input").value = "";
            })
            .withFailureHandler(function(err) {
              showLoading(false);
              alert("上傳清洗出錯: " + err);
            })
            .api_uploadAndCleanERP(rows, file.name, currentUser);

        } catch (err) {
          showLoading(false);
          alert("檔案解析失敗: " + err.message);
        }
      };

      reader.readAsArrayBuffer(file);
    }
