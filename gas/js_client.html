    function toggleUserStatus(empNo, targetStatus) {
      const actionName = (targetStatus === "ACTIVE") ? "啟用" : "停用";
      if (!confirm(`確定要【${actionName}】工號 [${empNo}] 嗎？`)) return;

      showLoading(true, `${actionName}處理中...`);
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          loadUsersList();
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("操作失敗: " + err);
        })
        .api_toggleUserStatus(currentUser.empNo, empNo, targetStatus);
    }

    function resetUserPassword(empNo) {
      if (!confirm(`確定要將工號 [${empNo}] 的密碼重設為 000000 嗎？（同仁下次登入必須設定新密碼）`)) return;

      showLoading(true, "重設密碼中...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          loadUsersList();
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("重設失敗: " + err);
        })
        .api_resetUserPassword(currentUser.empNo, empNo);
    }

    function handleAdminCreateUser() {
      const empNo = document.getElementById("admin-new-empno").value.trim();
      const name = document.getElementById("admin-new-name").value.trim();
      const role = document.getElementById("admin-new-role").value;

      if (!empNo || !name) {
        alert("請輸入工號與姓名！");
        return;
      }

      showLoading(true, "建立同仁中...");
      google.script.run
        .withSuccessHandler(function(res) {
          showLoading(false);
          alert(res.message);
          if (res.success) {
            document.getElementById("admin-new-empno").value = "";
            document.getElementById("admin-new-name").value = "";
            loadUsersList();
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert("建立失敗: " + err);
        })
        .api_createUserByAdmin(currentUser.empNo, empNo, name, role);
    }

    // ==================== 系統操作日誌 (Audit Log) 控制器 ====================
    let auditCurrentPage = 1;
    let auditTotalPages = 1;
    let currentAuditLogsCache = [];

    function getAuditFiltersFromUI() {
      return {
        startDate: document.getElementById("audit-filter-start").value || "",
        endDate: document.getElementById("audit-filter-end").value || "",
        module: document.getElementById("audit-filter-module").value || "ALL",
        action: document.getElementById("audit-filter-action").value || "ALL",
        status: document.getElementById("audit-filter-status").value || "ALL",
        source: document.getElementById("audit-filter-source").value || "ALL",
        keyword: (document.getElementById("audit-filter-keyword").value || "").trim(),
        showAuto: document.getElementById("audit-filter-show-auto").checked
      };
    }

    function resetAuditFilters() {
      document.getElementById("audit-filter-start").value = "";
      document.getElementById("audit-filter-end").value = "";
      document.getElementById("audit-filter-module").value = "ALL";
      document.getElementById("audit-filter-action").value = "ALL";
      document.getElementById("audit-filter-status").value = "ALL";
      document.getElementById("audit-filter-source").value = "ALL";
      document.getElementById("audit-filter-keyword").value = "";
      document.getElementById("audit-filter-show-auto").checked = false;
      loadAuditLogs(1);
    }

    function loadAuditLogs(targetPage) {
      if (!currentUser || currentUser.role !== "ADMIN") return;
      auditCurrentPage = targetPage || 1;

      const filters = getAuditFiltersFromUI();
      const tbody = document.getElementById("audit-logs-tbody");
      tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #94a3b8; padding: 20px;">載入日誌中...</td></tr>';

      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.success) {
            alert("載入操作日誌失敗: " + res.message);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #ef4444; padding: 16px;">載入失敗: ${res.message}</td></tr>`;
            return;
          }

          // 刷新頂部統計
          if (res.stats) {
            document.getElementById("stat-audit-today-total").innerText = res.stats.todayCount || 0;
            document.getElementById("stat-audit-today-fail").innerText = res.stats.todayFailures || 0;
            document.getElementById("stat-audit-today-users").innerText = res.stats.todayActiveUsers || 0;
          }

          auditTotalPages = res.totalPages || 1;
          currentAuditLogsCache = res.logs || [];
          renderAuditLogsTable(res);
        })
        .withFailureHandler(function(err) {
          alert("日誌連線異常: " + err);
          tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #ef4444; padding: 16px;">連線失敗: ${err}</td></tr>`;
        })
        .api_getAuditLogs(currentUser.empNo, filters, auditCurrentPage, 50);
    }

    function renderAuditLogsTable(res) {
      const tbody = document.getElementById("audit-logs-tbody");
      const logs = res.logs || [];
      const total = res.totalCount || 0;
      const page = res.page || 1;
      const totalPages = res.totalPages || 1;

      // 分頁條資訊
      const startCount = total === 0 ? 0 : (page - 1) * 50 + 1;
      const endCount = Math.min(page * 50, total);
      document.getElementById("audit-page-start").innerText = startCount;
      document.getElementById("audit-page-end").innerText = endCount;
      document.getElementById("audit-page-total").innerText = total;
      document.getElementById("audit-page-current").innerText = `第 ${page} / ${totalPages} 頁`;

      document.getElementById("audit-btn-prev").disabled = (page <= 1);
      document.getElementById("audit-btn-next").disabled = (page >= totalPages);

      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #94a3b8; padding: 24px;">查無符合條件之操作日誌</td></tr>';
        return;
      }

      tbody.innerHTML = logs.map(item => {
        let statusBadge = item.status === "成功"
          ? '<span class="tag tag-success">成功</span>'
          : '<span class="tag tag-failed">失敗</span>';

        let sourceBadge = '<span class="tag tag-webapp">網頁</span>';
        if (item.source === "SYSTEM_AUTO") {
          sourceBadge = '<span class="tag tag-auto">系統自動</span>';
        } else if (item.source === "SHEET_MANUAL") {
          sourceBadge = '<span class="tag tag-manual">試算表手動</span>';
        }

        const operatorText = item.name ? `${item.name} (${item.empNo})` : (item.empNo || "SYSTEM");
        const isFail = item.status === "失敗";
        const rowClass = isFail ? 'class="highlight-row"' : "";

        let summaryText = escapeHtml(item.summary);
        if (item.errorMessage) {
          summaryText += `<div style="font-size: 11px; color: #ef4444; margin-top: 2px;">錯誤: ${escapeHtml(item.errorMessage)}</div>`;
        }

        return `
          <tr ${rowClass}>
            <td style="font-family: ui-monospace, monospace; font-size: 12px; color: #475569; white-space: nowrap;">${item.time}</td>
            <td style="font-size: 12px; font-weight: 600;">${escapeHtml(operatorText)}</td>
            <td><span class="tag tag-sales" style="font-size: 11px;">${escapeHtml(item.module)}</span></td>
            <td><strong>${escapeHtml(item.action)}</strong></td>
            <td style="font-size: 12px; color: #334155; word-break: break-all;">${escapeHtml(item.target || "-")}</td>
            <td style="font-size: 12px; color: #1e293b; line-height: 1.4;">${summaryText}</td>
            <td>${statusBadge}</td>
            <td>${sourceBadge}</td>
          </tr>
        `;
      }).join("");
    }

    function changeAuditPage(delta) {
      const targetPage = auditCurrentPage + delta;
      if (targetPage >= 1 && targetPage <= auditTotalPages) {
        loadAuditLogs(targetPage);
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function exportAuditLogsCsv() {
      if (!currentAuditLogsCache || currentAuditLogsCache.length === 0) {
        alert("目前清單中無可匯出之日誌紀錄！");
        return;
      }

      const headers = ["紀錄ID", "操作時間", "工號", "姓名", "角色", "功能模組", "動作類型", "目標物件", "操作摘要", "結果", "錯誤訊息", "來源"];
      const rows = currentAuditLogsCache.map(l => [
        `"${(l.logId || "").replace(/"/g, '""')}"`,
        `"${(l.time || "").replace(/"/g, '""')}"`,
        `"${(l.empNo || "").replace(/"/g, '""')}"`,
        `"${(l.name || "").replace(/"/g, '""')}"`,
        `"${(l.role || "").replace(/"/g, '""')}"`,
        `"${(l.module || "").replace(/"/g, '""')}"`,
        `"${(l.action || "").replace(/"/g, '""')}"`,
        `"${(l.target || "").replace(/"/g, '""')}"`,
        `"${(l.summary || "").replace(/"/g, '""')}"`,
        `"${(l.status || "").replace(/"/g, '""')}"`,
        `"${(l.errorMessage || "").replace(/"/g, '""')}"`,
        `"${(l.source || "").replace(/"/g, '""')}"`
      ]);

      const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      link.setAttribute("href", url);
      link.setAttribute("download", `DIY系統操作日誌_${timestamp}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
